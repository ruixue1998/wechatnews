name: Update RSS (Direct AI)

on:
  schedule:
    - cron: '45 2 * * *' # 北京时间 10:45 运行
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Direct RSS Generator
        env:
          AI_AUTH_TOKEN: ${{ secrets.AI_AUTH_TOKEN }}
        run: python main_rss.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'CI: Auto-update RSS (Direct AI)'
          file_pattern: 'DailyNews.xml'
